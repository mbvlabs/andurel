version: "2"
sql:
  - engine: "postgresql"
    queries: "models/queries"
    schema: "migrations"
    gen:
      go:
        package: "queries"
        out: "models/internal/queries"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        row_mapping: andurel
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type: "database/sql.NullString"
          - db_type: "varchar"
            nullable: true
            go_type: "database/sql.NullString"
          - db_type: "bpchar"
            nullable: true
            go_type: "database/sql.NullString"
          - db_type: "bool"
            nullable: true
            go_type: "database/sql.NullBool"
          - db_type: "int2"
            nullable: true
            go_type: "database/sql.NullInt16"
          - db_type: "int4"
            nullable: true
            go_type: "database/sql.NullInt32"
          - db_type: "int8"
            nullable: true
            go_type: "database/sql.NullInt64"
          - db_type: "float4"
            nullable: true
            go_type: "database/sql.NullFloat64"
          - db_type: "float8"
            nullable: true
            go_type: "database/sql.NullFloat64"
          - db_type: "numeric"
            nullable: true
            go_type: "database/sql.NullFloat64"
          - db_type: "date"
            nullable: true
            go_type: "database/sql.NullTime"
          - db_type: "timestamp"
            nullable: true
            go_type: "database/sql.NullTime"
          - db_type: "timestamptz"
            nullable: true
            go_type: "database/sql.NullTime"
