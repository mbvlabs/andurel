name: Test

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        check-latest: false

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Check public API and CLI contracts
      run: ./scripts/check-contracts.sh

    - name: Install pinned tools
      run: ./scripts/install-dev-tools.sh

    - name: Run go vet
      run: |
        go vet ./...
        ./scripts/vet-standalone-modules.sh

    - name: Run golden CLI tests
      run: go test ./golden/... -v -timeout 15m

    # Coverage + pkg suite return with Phase 2; keep the step visible but non-blocking.
    - name: Run pkg tests with coverage (informational)
      continue-on-error: true
      run: ./scripts/coverage.sh

    - name: Upload coverage to Codecov
      if: success() || failure()
      continue-on-error: true
      uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        disable_search: true
        flags: unit
        fail_ci_if_error: false
