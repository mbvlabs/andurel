name: Golden Files

on:
  pull_request:

jobs:
  golden-files:
    name: Check golden files
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Download dependencies
        run: go mod download

      - name: Run golden CLI tests
        run: just test-golden
