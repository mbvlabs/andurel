name: Nightly Test Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Download dependencies
        run: go mod download

      - name: Run nightly test suite
        run: just ci-nightly

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly Test Suite Failed',
              body: `The nightly test suite failed. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['nightly-failure', 'automated']
            })
