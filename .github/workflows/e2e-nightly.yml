name: Nightly Test Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install pinned tools
        run: ./scripts/install-dev-tools.sh

      - name: Run go vet
        run: |
          go vet ./...
          ./scripts/vet-standalone-modules.sh

      - name: Check contracts
        run: ./scripts/check-contracts.sh

      - name: Run golden CLI tests (generate + sync + full scaffold)
        env:
          ANDUREL_GOLDEN_FULL: "1"
        run: go test ./golden/... -v -timeout 45m

      - name: Run unit tests with race detection
        run: go test $(go list ./... | grep -v '/golden$') -race -count=1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly Test Suite Failed',
              body: `The nightly test suite failed. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['nightly-failure', 'automated']
            })
